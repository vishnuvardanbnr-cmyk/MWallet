<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="40" fill="#1C1816"/>

  <!-- ── Fox head outline / main shape ── -->
  <!-- Head: wide trapeziod -->
  <polygon points="100,28 162,55 155,120 100,145 45,120 38,55" fill="#F6851B"/>

  <!-- Ear left -->
  <polygon points="38,55 55,22 72,60" fill="#F6851B"/>
  <!-- Ear right -->
  <polygon points="162,55 145,22 128,60" fill="#F6851B"/>

  <!-- Ear inner left (darker) -->
  <polygon points="55,22 48,50 66,56" fill="#CD6116"/>
  <!-- Ear inner right -->
  <polygon points="145,22 134,56 152,50" fill="#CD6116"/>

  <!-- Forehead center darker band -->
  <polygon points="100,28 80,55 120,55" fill="#E4761B"/>

  <!-- Cheek pouches (light tan) -->
  <polygon points="45,120 60,95 78,108 72,130" fill="#D7C1B3"/>
  <polygon points="155,120 128,130 122,108 140,95" fill="#D7C1B3"/>

  <!-- Face center (muzzle area) -->
  <polygon points="78,108 100,125 122,108 110,90 90,90" fill="#E8C9B0"/>

  <!-- Upper face (forehead, darker) -->
  <polygon points="80,55 90,90 110,90 120,55" fill="#CD6116"/>

  <!-- Left eye area -->
  <ellipse cx="72" cy="80" rx="14" ry="13" fill="#CD6116"/>
  <ellipse cx="72" cy="80" rx="10" ry="9" fill="#1C1816"/>
  <ellipse cx="70" cy="78" rx="4"  ry="4"  fill="white" opacity="0.9"/>

  <!-- Right eye area -->
  <ellipse cx="128" cy="80" rx="14" ry="13" fill="#CD6116"/>
  <ellipse cx="128" cy="80" rx="10" ry="9" fill="#1C1816"/>
  <ellipse cx="126" cy="78" rx="4"  ry="4"  fill="white" opacity="0.9"/>

  <!-- Nose -->
  <ellipse cx="100" cy="110" rx="8" ry="6" fill="#763D16"/>
  <!-- Nose highlight -->
  <ellipse cx="97"  cy="108" rx="2.5" ry="2" fill="white" opacity="0.4"/>

  <!-- Mouth lines -->
  <path d="M94,116 Q100,122 106,116" stroke="#763D16" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Chin / lower jaw -->
  <polygon points="72,130 100,145 128,130 100,125" fill="#E4761B"/>

  <!-- Neck / body start -->
  <polygon points="72,130 60,165 100,155 140,165 128,130 100,145" fill="#F6851B"/>

  <!-- Body chest markings -->
  <polygon points="84,152 100,160 116,152 100,145" fill="#E2761B"/>
</svg>
